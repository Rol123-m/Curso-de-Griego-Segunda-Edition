<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido Semanal - Curso de Griego</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .week-content {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .week-header {
            border-bottom: 3px solid var(--primary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .progress-bar-container {
            background: var(--gray-light);
            height: 10px;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .resource-section {
            background: var(--light);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }
        
        .resource-list {
            list-style: none;
            padding: 0;
        }
        
        .resource-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }
        
        .resource-item:hover {
            background: rgba(74, 111, 165, 0.05);
            transform: translateX(5px);
        }
        
        .resource-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .game-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: var(--radius);
            color: white;
            margin: 20px 0;
        }
        
        .iframe-container {
            width: 100%;
            height: 600px;
            border-radius: var(--radius);
            overflow: hidden;
            margin: 20px 0;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .completion-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--success);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="weekContent" class="week-content fade-in">
            <!-- Contenido cargado dinámicamente -->
        </div>
        
        <div class="text-center">
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver al Dashboard
            </a>
            
            <button id="markComplete" class="btn btn-success">
                <i class="fas fa-check-circle"></i> Marcar Semana como Completada
            </button>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-logo">
                <img src="mas logos.jpeg" alt="Ministerio Vivos para Servir" class="logo-small">
                <span>Ministerio "Vivos para Servir"</span>
            </div>
            <div class="footer-info">
                <p>Curso de Griego Koiné Elemental © 2026</p>
            </div>
        </div>
    </footer>

    <script src="semana.js"></script>
</body>
</html>
